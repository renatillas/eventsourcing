<h2 id="%C2%BFqu%C3%A9-es-event-sourcing-%F0%9F%A4%94">¿Qué es Event Sourcing? <img class="emoji" draggable="false" alt="🤔" src="https://cdn.jsdelivr.net/gh/jdecked/twemoji@16.0.1/assets/svg/1f914.svg" data-marp-twemoji=""/></h2>
<p>En lugar de guardar el <strong>estado actual</strong>, guardamos la <strong>secuencia de eventos</strong> que llevaron a ese estado.</p>
<pre is="marp-pre" data-auto-scaling="downscale-only"><code>CRUD Tradicional:
┌─────────────────┐
│ Balance: $1000  │ ← Solo el estado actual
└─────────────────┘

Event Sourcing:
┌──────────────────────────────────────────┐
│ 1. AccountOpened                         │
│ 2. CustomerDepositedCash($500)           │
│ 3. CustomerDepositedCash($600)           │
│ 4. CustomerWithdrewCash($100)            │
│ = Balance: $1000                         │
└──────────────────────────────────────────┘
</code></pre>
